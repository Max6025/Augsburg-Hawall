<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Energiekarte ansehen</title>
<link rel="stylesheet" href="diagramm.css">
<style>
  :root { --text:#f2f2f0; --muted:#8a8b91; }
  body { margin:0; background:#0b0a12; color:var(--text);
    font-family:'Segoe UI',system-ui,sans-serif; padding:16px; }
  h1 { font-size:1rem; font-weight:600; color:var(--muted); margin:0 0 12px; }
  .reihe { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .karte { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.08);
    border-radius:20px; padding:10px; aspect-ratio:1/1; display:flex; flex-direction:column; }
  .karte h2 { font-size:.72rem; font-weight:600; color:var(--muted); margin:2px 0 0 8px;
    text-transform:uppercase; letter-spacing:.07em; }
  .feld { flex:1; min-height:0; }
  .breit { grid-column: span 2; aspect-ratio: 2/1; }
</style>
</head>
<body>
  <h1>Vier Lagen, und einmal auf einer 2×1-Karte — links oben sind deine echten Werte von gerade</h1>
  <div class="reihe" id="reihe"></div>
<script src="symbole.js"></script>
<script src="diagramm.js"></script>
<script>
  const faelle = [
    ['Eurasburg jetzt', { solarW:5198, netzBezugW:12, netzEinspeisungW:0, hausW:5210 }],
    ['Einspeisung', { solarW:4200, netzBezugW:0, netzEinspeisungW:2600, hausW:1600 }],
    ['Nacht, nur Netz', { solarW:0, netzBezugW:840, netzEinspeisungW:0, hausW:840 }],
    ['ohne Solar', { netzBezugW:1240, netzEinspeisungW:0, hausW:1240 }],
    ['mit Batterie, lädt', { solarW:3900, netzBezugW:0, netzEinspeisungW:300, hausW:2100,
      batterieW:1500, batterieLaedt:true, batterieSoc:64 }],
    ['mit Batterie, entlädt', { solarW:0, netzBezugW:120, netzEinspeisungW:0, hausW:760,
      batterieW:640, batterieLaedt:false, batterieSoc:38 }]
  ];
  const r = document.getElementById('reihe');
  faelle.forEach(([titel, d], i) => {
    const k = document.createElement('div');
    k.className = 'karte' + (i === 4 ? ' breit' : '');
    k.innerHTML = '<h2>' + titel + '</h2><div class="feld">' +
      EnergieDiagramm.diagramm(Object.assign({ schwelleW:5, symbole: window.PROBE_SYMBOLE }, d)) + '</div>';
    r.appendChild(k);
  });
</script>
</body>
</html>
