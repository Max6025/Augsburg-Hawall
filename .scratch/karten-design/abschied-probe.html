<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Abschiedsschirm – Vorschau</title>
<!--
  Der Abschiedsschirm mit erfundenem Inhalt und echten Karten -- ohne Home Assistant, ohne
  Electron, ohne Termin. Lädt dieselbe CSS-Datei und dieselben Module wie das Dashboard.

  Die Karten bekommen hier ABSICHTLICH die Maße und Plätze, die sie in einem Unterdashboard
  hätten (6x6-Raster der Wand) -- inklusive einer 3x4-Alarmkarte weit rechts. Genau daran ist
  es am 2026-09-14 auf der Wand zerbrochen: Ohne abschiedSpanne() hängt die letzte Karte halb
  außerhalb des Bildschirms. Wer hier etwas ändert, sieht es also sofort.

  Öffnen: direkt im Browser. ?hell für das helle Design (die Bühne bleibt dunkel, das ist so).
  Am besten bei 1280x854 ansehen -- das ist die echte Panelgröße.
-->
<link rel="stylesheet" href="../../renderer/shared/dashboard.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* Der Schirm ist im Betrieb ein Overlay über dem Dashboard. Hier soll er einfach die
     ganze Fläche haben -- deshalb sichtbar schalten und nichts darunter legen. */
</style>
</head>
<body class="wandanzeige">
<div class="ankunftsschirm abschiedsschirm as-sichtbar" id="abschiedsschirm"></div>

<script src="../../renderer/shared/dashboard-render.js"></script>
<script src="../../renderer/shared/akku.js"></script>
<script src="../../renderer/shared/alarm.js"></script>
<script src="../../renderer/shared/ankunftsschirm.js"></script>
<script>
const Z = (state, attributes = {}) => ({ state, attributes });
DashboardRender.applyCustomTheme(DashboardRender.DEFAULT_THEME);
if (new URLSearchParams(location.search).has('hell')) document.body.classList.add('light-theme');

const schirm = new AnkunftsschirmModul.Abschiedsschirm(document.getElementById('abschiedsschirm'), {
  beimWegtippen: () => console.log('weggetippt')
});

schirm.inhaltSetzen({
  ueberschrift: '**Heimreise** steht an',
  text: '- Saugen\n'
      + '- Alle Türen verschließen und Schlüssel verstecken\n'
      + '- Fensterläden zu\n'
      + '- Gewinde wieder eindrehen und mit Mutter verschließen\n'
      + '- Müll mitnehmen',
  testmodus: true,
  fensterStart: 'probe'
});

// Maße und Plätze wie aus einem echten Unterdashboard -- x/y aus dem 6x6-Raster der Wand.
const KARTEN = [
  ['alarm_control_panel.haus', 'alarm', Z('disarmed', { friendly_name: 'Alarmanlage', supported_features: 7 }), { cols: 3, rows: 4, x: 3, y: 0 }],
  ['sensor.muell', 'waste', Z('on', { friendly_name: 'Mülltermine' }), { cols: 2, rows: 4, x: 0, y: 0 }],
  ['sensor.aussen', 'temperature', Z('19.4', { friendly_name: 'Außen', unit_of_measurement: '°C' }), { cols: 1, rows: 2, x: 5, y: 4 }],
  ['clock:1', 'clock', null, { cols: 2, rows: 2, x: 0, y: 4 }],
  ['cover.tor', 'fluegeltor', Z('closed', { friendly_name: 'Einfahrt', device_class: 'gate' }), { cols: 2, rows: 2, x: 2, y: 4 }]
];

const flaeche = schirm.kartenFlaeche();
KARTEN.forEach(([id, typ, zustand, span]) => {
  flaeche.appendChild(DashboardRender.buildCard(id, zustand, typ, DashboardRender.abschiedSpanne(span), {
    editable: false, apiBase: '', statesById: {}, settings: {}, callbacks: {}
  }));
});

schirm.zeigen('probe');
window.__schirm = schirm;   // fuer die Gegenprobe von aussen

// Gegenprobe für die Augen: Ragt etwas aus der Fläche heraus?
window.addEventListener('load', () => {
  const f = schirm.kartenFlaeche().getBoundingClientRect();
  const raus = [...schirm.kartenFlaeche().children].filter(c => {
    const r = c.getBoundingClientRect();
    return r.right > f.right + 1 || r.bottom > f.bottom + 1;
  });
  console.log(raus.length ? 'RAGT HERAUS: ' + raus.length + ' Karte(n)' : 'Alle Karten liegen in der Fläche.');
});
</script>
</body>
</html>
