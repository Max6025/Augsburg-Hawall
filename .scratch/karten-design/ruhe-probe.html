<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Ruheschirm – Vorschau</title>
<!--
  Der Ruheschirm ueber einem angedeuteten Dashboard. Ohne Home Assistant, ohne Electron.

  Im Betrieb laeuft er NUR auf dem Panel (IM_PANEL), deshalb ist er in der Live-Ansicht nicht
  zu sehen und dort auch nicht nachstellbar. Diese Probe baut ihn von Hand auf.

  Tippen weckt -- danach legt er sich nach fuenf Sekunden wieder hin (im Betrieb: Minuten).
  Am besten bei 1280x854 ansehen, das ist die echte Panelgroesse.
-->
<link rel="stylesheet" href="../../renderer/shared/dashboard.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  .raster { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr);
    gap: 1.2vh; height: 100%; padding: 1.6vh; box-sizing: border-box; }
  .stand { position: fixed; left: 1vh; bottom: 1vh; z-index: 99999;
    font: 500 1.5vh system-ui, sans-serif; color: #9aa; background: rgba(0,0,0,0.55);
    padding: 0.6vh 1.2vh; border-radius: 0.8vh; pointer-events: none; }
</style>
</head>
<body class="wandanzeige">
  <div class="raster" id="raster"></div>
  <div class="ruheschirm" id="ruheschirm"></div>
  <div class="stand" id="stand"></div>

<script src="../../renderer/shared/dashboard-render.js"></script>
<script src="../../renderer/shared/ruheschirm.js"></script>
<script>
DashboardRender.applyCustomTheme(DashboardRender.DEFAULT_THEME);
if (new URLSearchParams(location.search).has('hell')) document.body.classList.add('light-theme');

// Ein bisschen Dashboard darunter, damit man sieht, was der Schirm zudeckt.
const Z = (state, attributes = {}) => ({ state, attributes });
const raster = document.getElementById('raster');
[
  ['sensor.aussen', 'temperature', Z('19.4', { friendly_name: 'Außen', unit_of_measurement: '°C' }), 2, 2],
  ['clock:1', 'clock', null, 2, 2],
  ['light.wohnen', 'light', Z('on', { friendly_name: 'Wohnzimmer', brightness: 180 }), 2, 2],
  ['alarm_control_panel.haus', 'alarm', Z('disarmed', { friendly_name: 'Alarmanlage', supported_features: 7 }), 3, 4]
].forEach(([id, typ, zustand, c, r]) => {
  raster.appendChild(DashboardRender.buildCard(id, zustand, typ, { cols: c, rows: r }, {
    editable: false, apiBase: '', statesById: {}, settings: {}, callbacks: {}
  }));
});

// Hier absichtlich SEKUNDEN statt Minuten -- sonst wartet man beim Ansehen drei Minuten.
const FRIST_SEKUNDEN = 5;
let letzteBedienung = Date.now();

const schirm = new RuheschirmModul.Ruheschirm(document.getElementById('ruheschirm'), {
  beimWecken: () => { letzteBedienung = Date.now(); schirm.verbergen(); pruefen(); }
});
schirm.textSetzen('');   // Vorgabetext

document.addEventListener('pointerdown', () => { letzteBedienung = Date.now(); }, { capture: true });

function pruefen() {
  const ruhen = RuheschirmModul.sollRuhen({
    aktiviert: true, imTermin: true, schirmSichtbar: false, nacht: false,
    letzteBedienung, minuten: FRIST_SEKUNDEN / 60, jetzt: new Date()
  });
  if (ruhen) schirm.zeigen(); else schirm.verbergen();
  const rest = Math.max(0, FRIST_SEKUNDEN - Math.round((Date.now() - letzteBedienung) / 1000));
  document.getElementById('stand').textContent = ruhen
    ? 'Ruheschirm liegt – tippen weckt'
    : 'Dashboard sichtbar, legt sich in ' + rest + ' s hin';
}
setInterval(pruefen, 250);
pruefen();
</script>
</body>
</html>
