<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Karten-Vorschau</title>
<!--
  Nur zum Ansehen waehrend der Arbeit am Karten-Design. Laedt dieselbe CSS-Datei und dasselbe
  Render-Modul wie das echte Dashboard, aber mit erfundenen Zustaenden -- so laesst sich das
  Aussehen pruefen, ohne Home Assistant, ohne Electron und ohne aufs Geraet zu muessen.

  Oeffnen: direkt im Browser. Sie ist bewusst NICHT Teil der App.
-->
<link rel="stylesheet" href="../../renderer/shared/dashboard.css">
<style>
  body { margin: 0; min-height: 100vh; }
  #grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.4vh;
    padding: 2vh; height: auto; min-height: 100vh; box-sizing: border-box;
    grid-auto-rows: 24vh;
  }
</style>
</head>
<body>
<div class="lebendig" aria-hidden="true"><span></span><span></span><span></span></div>
<div id="grid"></div>
<script src="../../renderer/shared/dashboard-render.js"></script>
<!-- Die Symbole aus Home Assistant. Im Betrieb werden sie NACHGELADEN, nur wenn eine Karte
     eines braucht -- hier direkt, damit die Vorschau ohne Zusatzlogik auskommt. -->
<script src="../../renderer/shared/mdi-pfade.js"></script>
<script>
const Z = (state, attributes = {}, last_changed) => ({ state, attributes, last_changed });

// Ein Querschnitt: bunte Typen, neutrale Typen, an und aus, mit und ohne Bedienelemente.
const KARTEN = [
  // Energiefluss in beiden Lagen. Diese Karte fehlte hier -- und ist deshalb nie jemandem
  // aufgefallen, bis sie auf der Wand hing. Was in der Vorschau fehlt, wird nicht angesehen.
  ['energy.fluss',     'energy', null, 2, 2],
  ['energy.batterie',  'energy', null, 2, 2],
  ['energy.breit',     'energy', null, 4, 2],
  ['energy.kaputt',    'energy', null, 2, 2],
  // Vier Groessenordnungen nebeneinander: Nur so sieht man, ob Staerke und Tempo der
  // Leitungen ueber den ganzen Bereich unterscheidbar bleiben. Zwischen 12 W und 5 kW liegen
  // fast drei Zehnerpotenzen.
  ['energy.wenig',     'energy', null, 2, 2],
  ['energy.mittel',    'energy', null, 2, 2],
  ['energy.viel',      'energy', null, 2, 2],
  ['light.wohnzimmer',    'light',       Z('on',  { friendly_name: 'Wohnzimmer', brightness: 180, supported_color_modes: ['color_temp'], min_color_temp_kelvin: 2200, max_color_temp_kelvin: 6500, color_temp_kelvin: 2900 }), 1, 1],
  ['light.flur',          'light',       Z('off', { friendly_name: 'Flur' }), 1, 1],
  ['switch.kaffee',       'switch',      Z('on',  { friendly_name: 'Kaffeemaschine' }), 1, 1],
  ['switch.aussen',       'switch',      Z('off', { friendly_name: 'Außenlicht' }), 1, 1],
  ['sensor.temp_aussen',  'temperature', Z('27.4', { friendly_name: 'Außen', unit_of_measurement: '°C' }), 1, 1],
  ['sensor.temp_keller',  'temperature', Z('6.2',  { friendly_name: 'Keller', unit_of_measurement: '°C' }), 1, 1],
  ['sensor.wind',         'wind',        Z('14',   { friendly_name: 'Wind', unit_of_measurement: 'km/h' }), 1, 1],
  ['sensor.regen',        'rain',        Z('0.4',  { friendly_name: 'Regen', unit_of_measurement: 'mm' }), 1, 1],
  ['climate.bad',         'climate',     Z('heat', { friendly_name: 'Bad', current_temperature: 21.5, temperature: 23, hvac_modes: ['off','heat'], min_temp: 5, max_temp: 30, target_temp_step: 0.5 }), 1, 1],
  ['cover.rollladen',     'cover',       Z('open', { friendly_name: 'Rollladen', current_position: 60, supported_features: 15 }), 1, 1],
  ['sensor.feuchte',      'humidity',    Z('54',   { friendly_name: 'Luftfeuchte' }), 1, 1],
  ['sensor.druck',        'pressure',    Z('1013', { friendly_name: 'Luftdruck', unit_of_measurement: 'hPa' }), 1, 1],
  ['sensor.batterie',     'gauge',       Z('72',   { friendly_name: 'Batterie', unit_of_measurement: '%', device_class: 'battery' }), 1, 1],
  ['fan.schlafzimmer',    'fan',         Z('on',   { friendly_name: 'Ventilator', percentage: 40, percentage_step: 10 }), 1, 1],
  ['lock.haustuer',       'lock',        Z('locked', { friendly_name: 'Haustür' }), 1, 1],
  ['sensor.zaehler',      'sensor',      Z('4231.7', { friendly_name: 'Zählerstand', unit_of_measurement: 'kWh' }), 1, 1],
  ['alarm_control_panel.a', 'alarm',      Z('disarmed', { friendly_name: 'Alarmanlage', supported_features: 7 }), 1, 1],
  ['alarm_control_panel.b', 'alarm',      Z('armed_away', { friendly_name: 'Alarmanlage', supported_features: 7 }), 1, 1],
  ['alarm_control_panel.c', 'alarm',      Z('pending', { friendly_name: 'Alarmanlage', supported_features: 7 }), 1, 1],
  ['alarm_control_panel.d', 'alarm',      Z('triggered', { friendly_name: 'Alarmanlage', supported_features: 7 }), 1, 1],
  ['binary_sensor.tor', 'gate', Z('off', { friendly_name: 'Tore' }), 2, 1],
  ['climate.off',  'climate', Z('off',      { friendly_name: 'Aus',        current_temperature: 21.5, hvac_modes: ['off','heat','cool'] }), 1, 1],
  ['climate.heat', 'climate', Z('heat',     { friendly_name: 'Heizen',     current_temperature: 21.5, temperature: 23, hvac_action: 'heating', hvac_modes: ['heat','off','cool'] }), 1, 1],
  ['climate.cool', 'climate', Z('cool',     { friendly_name: 'Kühlen',     current_temperature: 25.5, temperature: 21, hvac_action: 'cooling', hvac_modes: ['cool','off'] }), 1, 1],
  ['climate.dry',  'climate', Z('dry',      { friendly_name: 'Entfeuchten', current_temperature: 23, temperature: 22, hvac_modes: ['dry','off'] }), 1, 1],
  ['climate.fan',  'climate', Z('fan_only', { friendly_name: 'Nur Lüfter', current_temperature: 23, temperature: 22, hvac_modes: ['fan_only','off'] }), 1, 1],
  ['climate.auto', 'climate', Z('auto',     { friendly_name: 'Automatik',  current_temperature: 23, temperature: 22, hvac_modes: ['auto','off'] }), 1, 1],
  ['sensor.solar', 'solar',    Z('412',  { friendly_name: 'Solar Radiation', unit_of_measurement: 'W/m²' }), 1, 1],
  ['sensor.t1',    'sensor',   Z('Automatik', { friendly_name: 'Betriebsart', icon: 'mdi:robot' }), 1, 1],
  ['sensor.t2',    'sensor',   Z('vor 3 min', { friendly_name: 'Letzter Abruf', icon: 'mdi:cloud-download' }), 1, 1],
  ['sensor.t3',    'sensor',   Z('bereit', { friendly_name: 'Zustand' }), 1, 1],
  ['sensor.t4',    'sensor',   Z('offen',  { friendly_name: 'Fenster Bad', icon: 'mdi:window-open' }), 1, 1],
  ['cover.tor_zu',   'fluegeltor', Z('closed',  { friendly_name: 'Einfahrt', device_class: 'gate' }), 1, 1],
  ['cover.tor_auf',  'fluegeltor', Z('open',    { friendly_name: 'Einfahrt offen', device_class: 'gate' }), 1, 1],
  ['cover.tor_oef',  'fluegeltor', Z('opening', { friendly_name: 'Einfahrt faehrt auf', device_class: 'gate' }), 1, 1],
  ['cover.tor_schl', 'fluegeltor', Z('closing', { friendly_name: 'Einfahrt faehrt zu', device_class: 'gate' }), 1, 1],
  ['cover.tor_unb',  'fluegeltor', Z('unavailable', { friendly_name: 'Einfahrt unbekannt', device_class: 'gate' }), 1, 1],
  ['cover.tor_kal',  'fluegeltor', Z('opening', { friendly_name: 'Einfahrt kalibriert' }, new Date(Date.now() - 9000).toISOString()), 1, 1],
  ['cover.tor_ueb',  'fluegeltor', Z('opening', { friendly_name: 'Einfahrt klemmt' }, new Date(Date.now() - 45000).toISOString()), 1, 1],
  ['cover.tor_dau',  'fluegeltor', Z('opening', { friendly_name: 'Einfahrt Dauer-Auf' }, new Date(Date.now() - 90000).toISOString()), 1, 1],
  ['nav.kueche',   'navigate', null, 1, 1],
  ['nav.bad',      'navigate', null, 2, 1]
];

const grid = document.getElementById('grid');
DashboardRender.applyCustomTheme(DashboardRender.DEFAULT_THEME);
// ?hell schaltet das helle Design an -- genau wie die Sonnenstand-Entitaet es im Betrieb tut.
if (new URLSearchParams(location.search).has('hell')) document.body.classList.add('light-theme');

// Erfundener Verlauf: eine leicht verrauschte Welle, damit die Flaeche im Hintergrund und
// der Tendenzpfeil ueberhaupt etwas zu zeichnen haben.
function verlauf(basis, spanne, steigend) {
  return Array.from({ length: 60 }, (_, i) => {
    const t = i / 59;
    const trend = steigend ? t * spanne : -t * spanne;
    return { t: i, v: basis + trend + Math.sin(i / 4) * spanne * 0.28 };
  });
}
const VERLAEUFE = {
  'sensor.temp_aussen': verlauf(24, 5, true),
  'sensor.temp_keller': verlauf(7.5, 2, false),
  'sensor.wind':        verlauf(9, 8, true),
  'sensor.regen':       verlauf(0.9, 0.8, false),
  'sensor.feuchte':     verlauf(49, 8, true),
  'sensor.druck':       verlauf(1009, 7, true),
  'sensor.zaehler':     verlauf(4180, 55, true)
};

// Sensorkarten bekommen ihre Farbe von aussen, genau wie auf der Wand.
const sensorFarben = DashboardRender.sensorAkzente(KARTEN.filter(k => k[1] === 'sensor').map(k => k[0]),
  new URLSearchParams(location.search).has('hell'));

// Rohwerte fuer die Energiekarten. In W, denn die Karte zeigt LEISTUNG -- und einmal bewusst
// ein kWh-Zaehler, damit auch die Warnung im Bild ist.
// Mit entity_id, denn die echten Zustaende von Home Assistant haben eine -- und die Warnung
// bei falscher Einheit nennt sie. Ohne stand in der Vorschau "undefined misst kWh", und genau
// so haette es auch auf der Wand ausgesehen, wenn die Kennung einmal fehlt.
const W = (v, name, id) => Object.assign(Z(String(v),
  { friendly_name: name, unit_of_measurement: 'W', device_class: 'power' }), { entity_id: id });
const KWH = (v, name, id) => Object.assign(Z(String(v),
  { friendly_name: name, unit_of_measurement: 'kWh', device_class: 'energy' }), { entity_id: id });
const ENERGIE = {
  'energy.fluss': { grid: W(12, 'Netzbezug', 'sensor.netzbezug'), gridReturn: W(0, 'Einspeisung', 'sensor.netzeinspeisung'), solar: W(5198, 'Kostal', 'sensor.kostal_wechselrichter') },
  'energy.batterie': { grid: W(0, 'Netzbezug', 'sensor.netzbezug'), gridReturn: W(300, 'Einspeisung', 'sensor.netzeinspeisung'),
    solar: W(3900, 'Kostal', 'sensor.kostal_wechselrichter'), battery: W(-1500, 'Akku', 'sensor.akkuleistung'), batterySoc: Z('64', { unit_of_measurement: '%' }) },
  'energy.breit': { grid: W(840, 'Netzbezug', 'sensor.netzbezug'), gridReturn: W(0, 'Einspeisung', 'sensor.netzeinspeisung'), solar: W(0, 'Kostal', 'sensor.kostal_wechselrichter') },
  'energy.kaputt': { grid: KWH(1234.5, 'Netzeinspeisung kWh', 'sensor.netzeinspeisung_kwh'), solar: KWH(5239.1, 'Wechselrichter kWh', 'sensor.kwh_kostal_wechselrichter_kwh') },
  'energy.wenig':  { grid: W(12, 'Netzbezug', 'sensor.netzbezug'), gridReturn: W(0, 'Einspeisung', 'sensor.netzeinspeisung'), solar: W(35, 'Kostal', 'sensor.kostal_wechselrichter') },
  'energy.mittel': { grid: W(420, 'Netzbezug', 'sensor.netzbezug'), gridReturn: W(0, 'Einspeisung', 'sensor.netzeinspeisung'), solar: W(680, 'Kostal', 'sensor.kostal_wechselrichter') },
  'energy.viel':   { grid: W(0, 'Netzbezug', 'sensor.netzbezug'), gridReturn: W(3100, 'Einspeisung', 'sensor.netzeinspeisung'), solar: W(8200, 'Kostal', 'sensor.kostal_wechselrichter') }
};

const nur = new URLSearchParams(location.search).get('nur');
(nur ? KARTEN.filter(k => k[1] === nur) : KARTEN).forEach(([id, typ, zustand, c, r]) => {
  const el = DashboardRender.buildCard(id, zustand, typ, { cols: c, rows: r }, {
    editable: false, apiBase: '', statesById: { 'light.dauerauf': { state: 'on' } }, history: VERLAEUFE[id], akzent: sensorFarben[id],
    energy: ENERGIE[id],
    // Gemessene Fahrzeit fuer die kalibrierten Tore -- 18 Sekunden auf.
    torZeiten: id.startsWith('cover.tor_') && id !== 'cover.tor_zu' ? { oeffnen: 18, schliessen: 20 } : undefined,
    settings: id === 'cover.tor_dau' ? { torDaueraufEntity: 'light.dauerauf' }
      : typ === 'navigate' ? { targetDashboardId: 'db_1', targetDashboardName: id === 'nav.bad' ? 'Badezimmer' : 'Küche' }
      : typ === 'gate' ? { gateButtons: [
      { label: 'Tor', entity: 'switch.a', icon: 'gate' },
      { label: 'Garage', entity: 'switch.b', icon: 'garage' },
      { label: 'Haustür', entity: 'switch.c', icon: 'door' },
      { label: 'Haustür Garage', entity: 'switch.d' }
    ] } : {}
    ,
    callbacks: {
    onSetBrightness: (e, v) => console.log('Helligkeit', e, v),
    onToggle: (d, e, st) => console.log('Umschalten', e, st),
    onFanSpeed: (e, v) => console.log('Stufe', e, v),
    // Zum Ansehen der Rueckmeldung: der erste Knopf gelingt, der zweite scheitert.
    onGatePress: (e) => new Promise(r => setTimeout(() => r(e !== 'switch.b'), 500))
    }
  });
  grid.appendChild(el);
});
</script>
</body>
</html>
